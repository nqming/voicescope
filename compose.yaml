services:
  voicescope:
    build: .
    image: voicescope:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      VOICESCOPE_ALLOWED_HOSTS: "localhost,127.0.0.1"
      VOICESCOPE_VERSION: "local-container"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
