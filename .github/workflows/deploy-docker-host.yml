name: Deploy existing Docker host
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'qminh19/voicescope@sha256:... (rollback: supply previous digest)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-docker-host
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate immutable image
        env:
          IMAGE: ${{ inputs.image }}
        run: '[[ "$IMAGE" =~ ^qminh19/voicescope@sha256:[a-f0-9]{64}$ ]]'
      - name: Deploy using preconfigured host checkout
        env:
          IMAGE: ${{ inputs.image }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash deploy/remote.sh '$IMAGE'"
